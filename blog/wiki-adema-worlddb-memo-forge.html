<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기억은 서재가 아니라 요람이다 — 메모리와 세계 모델, 통합의 조건</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --ink:#2c2825;
    --warm:#c2703e;
    --blue:#5b7c99;
    --green:#6b9e7a;
    --card:rgba(255,255,255,0.7);
    --border:rgba(194,112,62,0.12);
    --soft:rgba(44,40,37,0.07);
    --muted:rgba(44,40,37,0.62);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 560px at 85% -8%, rgba(194,112,62,0.06), transparent 60%),
      radial-gradient(900px 480px at -10% 28%, rgba(91,124,153,0.05), transparent 62%),
      radial-gradient(800px 500px at 50% 105%, rgba(107,158,122,0.05), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-weight:400;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  article.page{
    max-width:860px;
    margin:0 auto;
    padding:clamp(1rem,3vw,2rem) clamp(1rem,4vw,1.6rem) 3.5rem;
  }
  /* ---------- 히어로 ---------- */
  .hero{
    padding:clamp(2.2rem,6vw,4rem) clamp(1.2rem,4vw,2.6rem);
    background:linear-gradient(160deg, rgba(194,112,62,0.08), rgba(255,255,255,0.45) 46%, rgba(91,124,153,0.07));
    border:1px solid var(--border);
    border-radius:24px;
    margin-top:1rem;
    box-shadow:0 10px 34px rgba(44,40,37,0.05);
  }
  .hero-label{
    letter-spacing:0.24em;
    font-size:clamp(0.7rem,1vw,0.8rem);
    font-weight:700;
    color:var(--warm);
    text-transform:uppercase;
    margin-bottom:1.1rem;
  }
  h1{
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.95rem,4.6vw + 0.7rem,3.15rem);
    line-height:1.28;
    font-weight:900;
    margin:0 0 1.1rem;
    letter-spacing:-0.01em;
  }
  .hero-sub{
    font-size:clamp(1rem,1.4vw,1.18rem);
    color:var(--muted);
    font-weight:400;
    margin:0 0 1.5rem;
    line-height:1.8;
  }
  .chips{display:flex;flex-wrap:wrap;gap:0.5rem;}
  .chip{
    background:rgba(255,255,255,0.72);
    border:1px solid var(--soft);
    border-radius:999px;
    padding:0.35rem 0.95rem;
    font-size:clamp(0.76rem,1vw,0.85rem);
    color:rgba(44,40,37,0.78);
    font-weight:500;
  }
  /* ---------- 타이포 ---------- */
  section{margin:clamp(3rem,7vw,4.6rem) 0;}
  .sec-eyebrow{
    font-family:'Source Serif 4',serif;
    color:var(--warm);
    font-weight:700;
    font-size:clamp(0.95rem,1.4vw,1.05rem);
    letter-spacing:0.12em;
    margin:0 0 0.5rem;
  }
  h2{
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.5rem,2.6vw + 0.6rem,2.15rem);
    line-height:1.35;
    font-weight:800;
    margin:0 0 0.4rem;
    letter-spacing:-0.01em;
  }
  .sec-sub{
    color:var(--muted);
    font-size:clamp(0.95rem,1.2vw,1.05rem);
    margin:0 0 1.6rem;
    font-weight:400;
  }
  h3{
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.14rem,1.6vw + 0.7rem,1.38rem);
    font-weight:700;
    margin:2.2rem 0 0.7rem;
    line-height:1.5;
  }
  p{font-size:clamp(1rem,0.35vw + 0.94rem,1.12rem);margin:0 0 1.25rem;}
  strong{font-weight:700;}
  .hl-warm{color:var(--warm);font-weight:700;}
  .hl-blue{color:var(--blue);font-weight:700;}
  .hl-green{color:var(--green);font-weight:700;}
  code.wiki{
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    background:rgba(91,124,153,0.09);
    color:var(--blue);
    padding:2px 8px;
    border-radius:7px;
    font-size:0.84em;
    overflow-wrap:anywhere;
    font-weight:500;
  }
  /* ---------- 인용구 ---------- */
  blockquote{
    border-left:4px solid var(--warm);
    max-width:800px;
    margin:2.6rem auto;
    padding:1.35rem 1.7rem;
    background:rgba(255,255,255,0.6);
    border-radius:0 16px 16px 0;
    box-shadow:0 6px 22px rgba(44,40,37,0.05);
    font-size:clamp(1.02rem,0.5vw + 0.96rem,1.17rem);
    line-height:1.85;
  }
  blockquote footer{
    margin-top:0.8rem;
    font-size:0.85em;
    color:var(--muted);
    font-weight:500;
  }
  /* ---------- 카드 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:clamp(1.15rem,2.4vw,1.7rem);
    box-shadow:0 8px 26px rgba(44,40,37,0.06);
    margin:1.6rem 0;
  }
  .card h3{margin-top:0;}
  .card ul{margin:0.6rem 0 0;padding-left:1.15rem;}
  .card li{margin-bottom:0.75rem;font-size:clamp(0.94rem,0.3vw + 0.9rem,1.04rem);line-height:1.8;}
  .card li:last-child{margin-bottom:0;}
  .card-tag{
    display:inline-block;
    font-size:0.75rem;
    font-weight:700;
    letter-spacing:0.14em;
    color:var(--muted);
    margin-bottom:0.5rem;
  }
  .card-blue{border-left:4px solid var(--blue);}
  .card-warm{border-left:4px solid var(--warm);}
  .card-green{border-left:4px solid var(--green);}
  .small-note{
    font-size:0.86em;
    color:var(--muted);
    margin-top:0.9rem;
    line-height:1.7;
  }
  /* ---------- 다이어그램 1 : 두 축 ---------- */
  .two-axis{display:flex;gap:0.8rem;align-items:stretch;margin:1.8rem 0;}
  .axis-box{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.2rem 1.3rem;
    box-shadow:0 6px 20px rgba(44,40,37,0.05);
  }
  .axis-box.memory{border-top:4px solid var(--warm);}
  .axis-box.world{border-top:4px solid var(--blue);}
  .axis-title{font-family:'Source Serif 4',serif;font-weight:700;font-size:clamp(1rem,1.3vw,1.12rem);margin:0 0 0.4rem;}
  .axis-def{font-size:0.9em;color:rgba(44,40,37,0.78);line-height:1.75;margin:0;}
  .axis-crack{
    margin-top:0.9rem;
    padding-top:0.85rem;
    border-top:1px dashed rgba(44,40,37,0.2);
    font-size:0.85em;
    line-height:1.75;
  }
  .axis-crack b{font-weight:700;}
  @media (max-width:620px){
    .two-axis{flex-direction:column;}
  }
  /* ---------- 다이어그램 2 : 삼각형 ---------- */
  .tri-frame{
    border:2px dashed rgba(91,124,153,0.4);
    border-radius:20px;
    padding:1.7rem 1.2rem 1.2rem;
    position:relative;
    margin:2.4rem 0 1.6rem;
    background:rgba(255,255,255,0.4);
  }
  .tri-label{
    position:absolute;
    top:-0.85em;
    left:50%;
    transform:translateX(-50%);
    background:var(--bg);
    padding:0 0.9rem;
    color:var(--blue);
    font-weight:700;
    font-size:clamp(0.82rem,1.1vw,0.92rem);
    white-space:nowrap;
  }
  .tri-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:1rem 1.15rem;
    box-shadow:0 5px 16px rgba(44,40,37,0.05);
    text-align:center;
  }
  .tri-box .tri-name{font-weight:700;font-size:0.95rem;margin-bottom:0.25rem;}
  .tri-box .tri-desc{font-size:0.82em;color:var(--muted);line-height:1.65;}
  .tri-env{border-top:3px solid var(--green);max-width:420px;margin:0 auto;}
  .tri-env .tri-name{color:var(--green);}
  .tri-memory{border-top:3px solid var(--warm);}
  .tri-memory .tri-name
</body>
</html>
