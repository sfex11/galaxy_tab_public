```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말전화 조직의 딜레마 — 분해는 무결성을 사고, 수율은 홉마다 새어 나간다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;0,8..60,900;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --ink:#2c2825;
    --sub:rgba(44,40,37,0.62);
    --orange:#c2703e;
    --blue:#5b7c99;
    --green:#6b9e7a;
    --card:rgba(255,255,255,0.7);
    --card-border:rgba(194,112,62,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-size:clamp(15px,2.4vw,17px);
    line-height:1.9;
    word-break:keep-all;
    overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:16px clamp(14px,4vw,28px) 60px;}

  /* ── 헤더 ── */
  header{padding:clamp(34px,7vw,64px) 0 10px;}
  .badge{
    display:inline-block;
    padding:5px 14px;
    border-radius:20px;
    font-size:clamp(11px,2vw,12.5px);
    font-weight:700;
    letter-spacing:0.4px;
    background:rgba(194,112,62,0.09);
    border:1px solid rgba(194,112,62,0.22);
    margin-bottom:22px;
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:900;
    font-size:clamp(27px,6.2vw,44px);
    line-height:1.35;
    letter-spacing:-0.3px;
    margin-bottom:18px;
  }
  h1 .tint{color:var(--orange);}
  .subtitle{
    font-size:clamp(14.5px,2.6vw,17px);
    color:var(--sub);
    line-height:1.85;
    margin-bottom:26px;
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:8px 18px;
    font-size:13px;color:var(--sub);
    border-top:1px solid rgba(44,40,37,0.08);
    padding-top:16px;
  }
  .meta b{font-weight:700;}

  /* ── 공통 카드 ── */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    box-shadow:0 4px 18px rgba(44,40,37,0.05);
    padding:clamp(18px,4vw,28px);
    margin:26px 0;
  }

  /* ── 핵심 입장 ── */
  .thesis{border-left:5px solid var(--orange);}
  .thesis .label{font-weight:900;font-size:13px;letter-spacing:1px;color:var(--orange);margin-bottom:8px;}
  .thesis p{margin-bottom:10px;}
  .thesis p:last-child{margin-bottom:0;}
  .strong-line{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:clamp(17px,3.4vw,20px);
    line-height:1.7;
  }
  .note{
    font-size:13.5px;color:var(--sub);
    background:rgba(91,124,153,0.06);
    border:1px dashed rgba(91,124,153,0.3);
    border-radius:12px;
    padding:14px 18px;margin:22px 0;
  }

  /* ── 목차 ── */
  .toc{padding:clamp(16px,3.5vw,22px) clamp(18px,4vw,28px);}
  .toc .toc-title{font-weight:900;font-size:14px;letter-spacing:1px;color:var(--sub);margin-bottom:12px;}
  .toc ol{list-style:none;counter-reset:toc;}
  .toc li{counter-increment:toc;border-bottom:1px solid rgba(44,40,37,0.06);}
  .toc li:last-child{border-bottom:none;}
  .toc a{
    display:flex;gap:12px;align-items:baseline;
    padding:9px 4px;text-decoration:none;color:var(--ink);
    font-size:clamp(13.5px,2.4vw,15px);font-weight:500;
    transition:color .2s;
  }
  .toc a:hover{color:var(--orange);}
  .toc a::before{
    content:counter(toc,decimal-leading-zero);
    font-family:'Source Serif 4',serif;font-weight:700;
    font-size:13px;flex-shrink:0;
  }
  .toc li:nth-child(1) a::before{color:var(--orange);}
  .toc li:nth-child(2) a::before{color:var(--blue);}
  .toc li:nth-child(3) a::before{color:var(--green);}
  .toc li:nth-child(4) a::before{color:var(--orange);}

  /* ── 섹션 ── */
  section{margin-top:clamp(46px,9vw,72px);}
  .sec-header{display:flex;align-items:flex-start;gap:clamp(10px,2.5vw,18px);margin-bottom:8px;}
  .sec-num{
    font-family:'Source Serif 4',serif;
    font-weight:900;line-height:0.9;
    font-size:clamp(42px,9vw,60px);
    opacity:0.28;flex-shrink:0;
  }
  .sec-c-o .sec-num{color:var(--orange);}
  .sec-c-b .sec-num{color:var(--blue);}
  .sec-c-g .sec-num{color:var(--green);}
  .sec-kicker{font-size:12.5px;font-weight:700;letter-spacing:1.2px;color:var(--sub);margin-bottom:4px;padding-top:6px;}
  h2{
    font-family:'Source Serif 4',serif;
    font-weight:900;
    font-size:clamp(21px,4.8vw,28px);
    line-height:1.4;letter-spacing:-0.2px;
  }
  .sec-divider{height:3px;border-radius:3px;width:64px;margin:16px 0 24px;}
  .sec-c-o .sec-divider{background:var(--orange);}
  .sec-c-b .sec-divider{background:var(--blue);}
  .sec-c-g .sec-divider{background:var(--green);}

  section p{margin-bottom:18px;}
  section p:last-child{margin-bottom:0;}
  h3{
    font-size:clamp(16px,3.2vw,18.5px);
    font-weight:700;margin:32px 0 12px;
    display:flex;align-items:center;gap:9px;line-height:1.5;
  }
  h3 .dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;margin-top:2px;}
  .d-o{background:var(--orange);} .d-b{background:var(--blue);} .d-g{background:var(--green);}
  .hl-o{color:var(--orange);font-weight:700;}
  .hl-b{color:var(--blue);font-weight:700;}
  .hl-g{color:var(--green);font-weight:700;}

  /* ── 위키 태그 ── */
  .wikitag{
    display:inline-block;
    font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
    font-size:0.8em;
    background:rgba(91,124,153,0.08);
    color:var(--blue);
    border:1px solid rgba(91,124,153,0.2);
    border-radius:6px;
    padding:0 6px;
    white-space:nowrap;
    vertical-align:1px;
  }

  /* ── 비유 박스 ── */
  .metaphor{
    background:rgba(107,158,122,0.07);
    border:1px solid rgba(107,158,122,0.25);
    border-radius:14px;
    padding:clamp(16px,3.5vw,22px) clamp(18px,4vw,24px);
    margin:24px 0;
  }
  .metaphor .m-label{
    font-size:12.5px;font-weight:900;letter-spacing:1px;
    color:var(--green);margin-bottom:8px;
    display:flex;align-items:center;gap:7px;
  }
  .metaphor p{font-size:clamp(14.5px,2.6vw,16px);margin-bottom:10px;}
  .metaphor p:last-child{margin-bottom:0;}

  /* ── 레버 그리드 ── */
  .lever-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:24px 0;}
  .lever{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    box-shadow:0 3px 12px rgba(44,40,37,0.04);
    padding:20px 18px;
  }
  .lever .ico{font-size:24px;margin-bottom:8px;display:block;}
  .lever .l-title{font-weight:900;font-size:15.5px;margin-bottom:8px;line-height:1.5;}
  .lever p{font-size:13.8px;line-height:1.8;color:rgba(44,40,37,0.82);margin-bottom:8px;}
  .lever p:last-child{margin-bottom:0;}
  .lv-o{border-top:3px solid var(--orange);}
  .lv-b{border-top:3px solid var(--blue);}
  .lv-g{border-top:3px solid var(--green);}

  /* ── 수식 박스 ── */
  .formula-box{
    text-align:center;
    background:var(--card);
    border:1px solid rgba(91,124,153,0.25);
    border-radius:14px;
    padding:clamp(18px,4vw,26px);
    margin:24px 0;
    box-shadow:0 3px 12px rgba(44,40,37,0.04);
  }
  .formula-box .f{
    font-family:'Source Serif 4',serif;
    font-size:clamp(26px,6vw,34px);
    font-weight:700;color:var(--blue);
    letter-spacing:1px;
  }
  .formula-box .f small{font-size:0.5em;font-weight:400;color:var(--sub);letter-spacing:0;}
  .formula-box .cap{font-size:13.5px;color:var(--sub);margin-top:10px;}

  /* ── 벽 카드 ── */
  .wall{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    box-shadow:0 4px 16px rgba(44,40,37,0.05);
    padding:clamp(20px,4vw,28px);
    margin:22px 0;
  }
  .wall h4{
    font-family:'Source Serif 4',serif;
    font-size:clamp(17px,3.6vw,20px);
    font-weight:900;margin-bottom:12px;
    display:flex;align-items:center;gap:10px;line-height:1.45;
  }
  .wall h4 .w-ico{font-size:22px;flex-shrink:0;}
  .wall p{margin-bottom:14px;}
  .wall p:last-child{margin-bottom:0;}
  .w1{border-top:4px solid var(--blue);}
  .w2{border-top:4px solid var(--green);}
  .w3{border-top:4px solid var(--orange);}
  .w1 h4{color:var(--blue);} .w2 h4{color:var(--green);} .w3 h4{color:var(--orange);}

  /* ── 인용구 ── */
  blockquote{
    border-left:4px solid var(--orange);
    background:rgba(255,255,255,0.55);
    max-width:800px;margin:auto;
    padding:clamp(16px,3.5vw,22px) clamp(18px,4vw,28px);
    border-radius:0 14px 14px 0;
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:clamp(16px,3.2vw,19px);
    line-height:1.8;
    margin-top:28px;margin-bottom:28px;
    color:rgba(44,40,37,0.92);
  }
  blockquote .q-mark{
    display:block;font-size:30px;line-height:1;
    color:var(--orange);opacity:0.5;margin-bottom:8px;
    font-family:'Source Serif 4',serif;
  }

  /* ── 전략 리스트 ── */
  .strategy{
    display:flex;gap:clamp(12px,3vw,20px);
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    box-shadow:0 4px 16px rgba(44,40,37,0.05);
    padding:clamp(20px,4vw,28px);
    margin:20px 0;
  }
  .strategy .s-num{
    font-family:'Source Serif 4',serif;
    font-weight:900;font-size:clamp(24px,5vw,30px);
    line-height:1;flex-shrink:0;padding-top:3px;
  }
  .strategy .s-body p{font-size:clamp(14.5px,2.6vw,16px);margin-bottom:12px;}
  .strategy .s-body p:last-child{margin-bottom:0;}
  .strategy h4{font-size:clamp(16px,3.4vw,18px);font-weight:900;margin-bottom:10px;line-height:1.5;}
  .st-o .s-num{color:var(--orange);} .st-b .s-num{color:var(--blue);} .st-g .s-num{color:var(--green);}

  /* ── 패러다임 비교 ── */
  .paradigm{display:grid;grid-template-columns:1fr;gap:14px;margin:26px 0;}
  @media(min-width:640px){.paradigm{grid-template-columns:1fr 1fr;}}
  .p-card{border-radius:16px;padding:22px 20px;border:1px solid;}
  .p-old{background:rgba(44,40,37,0.035);border-color:rgba(44,40,37,0.1);}
  .p-new{background:rgba(107,158,122,0.07);border-color:rgba(107,158,122,0.3);}
  .p-card .p-label{font-size:12px;font-weight:900;letter-spacing:1px;margin-bottom:10px;}
  .p-old .p-label{color:var(--sub);}
  .p-new .p-label{color:var(--green);}
  .p-card .p-q{
    font-family:'Source Serif 4',serif;font-weight:700;
    font-size:clamp(15.5px,3vw,17.5px);line-height:1.6;margin-bottom:12px;
  }
  .p-card .p-sub{font-size:13.5px;color:var(--sub);line-height:1.8;}
  .p-new .p-q{color:var(--ink);}
  .arrow-hint{text-align:center;font-size:22px;color:var(--sub);}

  /* ── 체크리스트 ── */
  .checklist{list-style:none;margin-top:8px;}
  .checklist li{
    display:flex;gap:14px;align-items:flex-start;
    padding:13px 4px;border-bottom:1px solid rgba(44,40,37,0.06);
    font-size:clamp(14px,2.6vw,15.5px);line-height:1.8;
  }
  .checklist li:last-child{border-bottom:none;}
  .checklist .chk{
    flex-shrink:0;width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;margin-top:5px;
  }
  .ck-o{background:rgba(194,112,62,0.12);color:var(--orange);}
  .ck-b{background:rgba(91,124,153,0.12);color:var(--blue);}
  .ck-g{background:rgba(107,158,122,0.14);color:var(--green);}

  /* ── 결론 마무리 ── */
  .final{
    margin-top:clamp(46px,9vw,70px);
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    box-shadow:0 6px 24px rgba(44,40,37,0.06);
    padding:clamp(24px,5vw,40px);
    position:relative;overflow:hidden;
  }
  .final::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--orange),var(--blue),var(--green));
  }
  .final h2{
    font-size:clamp(22px,5vw,30px);margin-bottom:20px;

</body>
</html>
