<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시연은 원료가 아니라 명세다 — RAPID와 저장 매체의 대전환</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;0,8..60,900;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:#faf9f7;
    color:#2c2825;
    font-family:'Noto Sans KR', sans-serif;
    font-size:clamp(1rem, 0.94rem + 0.35vw, 1.09rem);
    line-height:1.9;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .progress {
    position:fixed; top:0; left:0; width:100%; height:3px;
    background:rgba(194,112,62,0.1); z-index:100;
  }
  .progress-bar {
    height:100%; width:0%;
    background:#c2703e;
    transition:width 0.1s linear;
  }
  .container {
    max-width:880px;
    margin:0 auto;
    padding:clamp(14px, 3vw, 36px);
    padding-top:clamp(16px, 3vw, 28px);
  }

  /* ---------- 헤더 ---------- */
  .kicker {
    color:#c2703e;
    font-size:clamp(0.72rem, 2.4vw, 0.82rem);
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .kicker .paper {
    color:#6b6259;
    font-weight:500;
    letter-spacing:0.02em;
    text-transform:none;
  }
  h1 {
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.75rem, 5.5vw, 2.7rem);
    font-weight:900;
    line-height:1.3;
    letter-spacing:-0.01em;
    margin-bottom:18px;
  }
  .subtitle {
    font-size:clamp(1rem, 3vw, 1.18rem);
    color:#6b6259;
    line-height:1.75;
    margin-bottom:22px;
    font-weight:400;
  }
  .meta {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    font-size:0.82rem; color:#8a8078;
    padding-bottom:22px;
    border-bottom:1px solid rgba(194,112,62,0.15);
    margin-bottom:8px;
  }
  .meta .tag {
    background:rgba(91,124,153,0.1);
    color:#5b7c99;
    padding:2px 10px;
    border-radius:99px;
    font-weight:500;
  }

  /* ---------- 네비게이션 (제공된 마크업) ---------- */

  /* ---------- 인용구 ---------- */
  blockquote {
    border-left:4px solid #c2703e;
    max-width:800px;
    margin:2.2rem auto;
    padding:1.1rem 1.5rem;
    background:rgba(194,112,62,0.05);
    border-radius:0 12px 12px 0;
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(0.98rem, 3vw, 1.1rem);
    line-height:1.85;
    color:#4a423a;
  }
  blockquote .q-source {
    display:block;
    margin-top:10px;
    font-family:'Noto Sans KR',sans-serif;
    font-size:0.8rem;
    color:#8a8078;
  }

  /* ---------- 카드 공통 ---------- */
  .card {
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(194,112,62,0.12);
    border-radius:14px;
    box-shadow:0 2px 14px rgba(44,40,37,0.05);
    padding:clamp(1.1rem, 3.5vw, 1.7rem);
  }

  /* ---------- TL;DR ---------- */
  .tldr { margin:2rem 0; }
  .tldr .label {
    color:#c2703e; font-weight:700; font-size:0.8rem;
    letter-spacing:0.12em; text-transform:uppercase;
    display:block; margin-bottom:10px;
  }
  .tldr .verdict {
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.08rem, 3.5vw, 1.28rem);
    font-weight:700; line-height:1.6; margin-bottom:14px;
  }
  .tldr ul { list-style:none; }
  .tldr li {
    position:relative; padding-left:1.5em; margin-bottom:8px;
    font-size:0.95em; line-height:1.8;
  }
  .tldr li::before {
    content:"→";
    position:absolute; left:0; color:#6b9e7a; font-weight:700;
  }

  /* ---------- 본문 섹션 ---------- */
  section { margin:3.2rem 0; }
  .sec-head { display:flex; align-items:baseline; gap:12px; margin-bottom:1.2rem; flex-wrap:wrap; }
  .sec-num {
    font-family:'Source Serif 4',serif;
    font-weight:900;
    font-size:0.95rem;
    color:#c2703e;
    background:rgba(194,112,62,0.1);
    border-radius:8px;
    padding:2px 12px;
    flex-shrink:0;
  }
  h2 {
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.35rem, 4.5vw, 1.85rem);
    font-weight:700;
    line-height:1.45;
    letter-spacing:-0.01em;
  }
  h3 {
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.1rem, 3.5vw, 1.3rem);
    font-weight:700;
    margin:1.8rem 0 0.7rem;
    color:#4a423a;
  }
  p { margin-bottom:1.15rem; }
  strong { font-weight:700; color:#2c2825; }
  em { font-style:italic; }
  .hl-orange { color:#c2703e; font-weight:700; }
  .hl-blue { color:#5b7c99; font-weight:700; }
  .hl-green { color:#6b9e7a; font-weight:700; }

  code.wiki-ref {
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:0.82em;
    background:rgba(91,124,153,0.09);
    color:#5b7c99;
    padding:0.12em 0.45em;
    border-radius:5px;
    word-break:break-all;
  }
  .paper-title {
    font-style:italic;
    color:#5b7c99;
    font-weight:600;
  }

  /* ---------- 비유 박스 ---------- */
  .analogy {
    background:rgba(107,158,122,0.07);
    border:1px solid rgba(107,158,122,0.28);
    border-radius:14px;
    padding:clamp(1.1rem, 3.5vw, 1.6rem);
    margin:1.8rem 0;
  }
  .analogy .label {
    color:#6b9e7a; font-weight:700; font-size:0.8rem;
    letter-spacing:0.12em; text-transform:uppercase;
    display:block; margin-bottom:10px;
  }
  .analogy p { font-size:0.95em; margin-bottom:0.8rem; }
  .analogy p:last-child { margin-bottom:0; }
  .analogy .two-col {
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:0.6rem 0;
  }
  .analogy .way {
    background:rgba(255,255,255,0.75);
    border-radius:10px; padding:0.9rem 1rem;
  }
  .analogy .way .way-title { font-weight:700; font-size:0.92em; margin-bottom:6px; }
  .analogy .way.a .way-title { color:#5b7c99; }
  .analogy .way.b .way-title { color:#6b9e7a; }
  .analogy .way p { font-size:0.88em; line-height:1.75; margin:0; }
  @media (max-width:600px){ .analogy .two-col { grid-template-columns:1fr; } }

  /* ---------- 비교 테이블 ---------- */
  .compare {
    margin:1.8rem 0;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(194,112,62,0.15);
    background:rgba(255,255,255,0.7);
    box-shadow:0 2px 14px rgba(44,40,37,0.05);
    font-size:0.9em;
  }
  .ct-row {
    display:grid;
    grid-template-columns:0.8fr 1.2fr 1.2fr;
  }
  .ct-row + .ct-row { border-top:1px solid rgba(194,112,62,0.1); }
  .ct-head { background:rgba(194,112,62,0.07); font-weight:700; }
  .ct-head > div { padding:10px 14px; font-size:0.9em; }
  .ct-row > div { padding:12px 14px; line-height:1.7; }
  .ct-axis { font-weight:700; color:#4a423a; background:rgba(250,249,247,0.6); }
  .ct-old { color:#4d6173; background:rgba(91,124,153,0.05); }
  .ct-new { color:#41604d; background:rgba(107,158,122,0.07); }
  @media (max-width:640px){
    .ct-row { grid-template-columns:1fr; }
    .ct-head { display:none; }
    .ct-axis { background:rgba(194,112,62,0.07); padding-bottom:6px; }
    .ct-old::before { content:"기존 ▸ "; font-weight:700; color:#5b7c99; }
    .ct-new::before { content:"RAPID ▸ "; font-weight:700; color:#6b9e7a; }
  }

  /* ---------- 3축 카드 ---------- */
  .axis-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:14px;
    margin:1.8rem 0;
  }
  .axis-card {
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(194,112,62,0.12);
    border-radius:12px;
    box-shadow:0 2px 10px rgba(44,40,37,0.04);
    padding:1.15rem 1.25rem;
  }
  .axis-card .ac-title {
    font-weight:700; font-size:1rem; margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  .axis-card p { font-size:0.88em; line-height:1.8; margin-bottom:0.5rem; }
  .axis-card p:last-child { margin-bottom:0; }

  /* ---------- 긴장 카드 ---------- */
  .tension {
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(194,112,62,0.12);
    border-left:4px solid #5b7c99;
    border-radius:0 14px 14px 0;
    box-shadow:0 2px 12px rgba(44,40,37,0.05);
    padding:clamp(1.1rem, 3.5vw, 1.6rem);
    margin:1.4rem 0;
  }
  .tension .t-label {
    font-size:0.78rem; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; color:#5b7c99; margin-bottom:6px;
    display:block;
  }
  .tension h4 {
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(1.05rem, 3.2vw, 1.22rem);
    font-weight:700; margin-bottom:10px;
  }

  /* ---------- 목차 ---------- */
  details.toc {
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(194,112,62,0.12);
    border-radius:12px;
    padding:0.9rem 1.2rem;
    margin:1.6rem 0;
    box-shadow:0 2px 10px rgba(44,40,37,0.04);
  }
  details.toc summary {
    cursor:pointer; font-weight:700; color:#c2703e;
    font-size:0.92rem; list-style:none;
  }
  details.toc summary::before { content:"▸ "; }
  details.toc[open] summary::before { content:"▾ "; }
  details.toc ol { margin:0.8rem 0 0.3rem 1.4rem; }
  details.toc li { margin-bottom:4px; font-size:0.9rem; }
  details.toc a { color:#2c2825; text-decoration:none; }
  details.toc a:hover { color:#c2703e; }

  /* ---------- 결론 ---------- */
  .conclusion-card {
    background:rgba(194,112,62,0.06);
    border:1px solid rgba(194,112,62,0.2);
    border-radius:16px;
    padding:clamp(1.3rem, 4vw, 2rem);
    margin:2.4rem 0;
  }
  .conclusion-card h2 { margin-bottom:1rem; }
  .turn-list { list-style:none; margin:1.2rem 0; }
  .turn-list li {
    background:rgba(255,255,255,0.75);
    border:1px solid rgba(194,112,62,0.1);
    border-radius:10px;
    padding:0.9rem 1.1rem;
    margin-bottom:10px;
    font-size:0.93em;
    line-height:1.8;
  }
  .turn-list .from { color:#5b7c99; font-weight:700; }
  .turn-list .to { color:#6b9e7a; font-weight:700; }

  footer {
    margin-top:3rem;
    padding-top:1.5rem;
    border-top:1px solid rgba(194,112,62,0.15);
    font-size:0.83rem;
    color:#8a8078;
    line-height:1.8;
  }

  a.inline-link { color:#5b7c99; text-decoration:underline; text-underline-offset:3px; }
</style>
</head>
<body>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<div class="container">


</body>
</html>
