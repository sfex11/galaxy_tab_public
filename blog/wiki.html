<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목적지는 하나, 경로는 무한 — LLM의 목표는 궤적에 새겨져 있지 않다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7;
  --ink:#2c2825;
  --accent:#c2703e;
  --accent-deep:#a4591f;
  --blue:#5b7c99;
  --blue-deep:#45678a;
  --green:#6b9e7a;
  --green-deep:#4e7d5d;
  --card:rgba(255,255,255,0.7);
  --card-border:rgba(194,112,62,0.12);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  font-size:clamp(15px,1.05rem + 0.2vw,17.5px);
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
}
#progress{
  position:fixed;top:0;left:0;height:3px;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--green));
  z-index:99;transition:width .1s linear;
}
.container{max-width:860px;margin:0 auto;padding:0 clamp(16px,4.5vw,30px);}
h1,h2,h3,.serif{font-family:'Source Serif 4','Noto Sans KR',serif;}

/* ── hero ── */
.hero{padding:clamp(30px,6vw,56px) 0 8px;}
.chip{
  display:inline-block;font-size:clamp(11px,0.8rem,13px);font-weight:700;
  color:var(--accent-deep);background:rgba(194,112,62,0.1);
  border:1px solid rgba(194,112,62,0.22);
  padding:5px 14px;border-radius:999px;letter-spacing:0.03em;
}
.hero h1{
  font-size:clamp(1.7rem,4.5vw + 0.5rem,2.75rem);
  font-weight:700;line-height:1.35;margin:18px 0 14px;
}
.hero h1 em{font-style:normal;color:var(--accent-deep);}
.subtitle{
  font-size:clamp(14.5px,1rem + 0.15vw,17px);color:#5c544e;
  margin:0 0 18px;line-height:1.8;
}
.meta{
  font-size:clamp(12px,0.85rem,13.5px);color:#7a7069;
  border-top:1px dashed rgba(44,40,37,0.14);
  padding-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;
}
.meta b{color:var(--ink);font-weight:700;}

/* ── cards ── */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:16px;
  box-shadow:0 4px 18px rgba(44,40,37,0.05);
  padding:clamp(18px,3vw,28px);
}

/* ── blockquote ── */
blockquote{
  border-left:4px solid var(--accent);
  max-width:800px;margin:30px auto;
  padding:16px 24px;
  background:var(--card);
  border-radius:0 14px 14px 0;
  box-shadow:0 3px 12px rgba(44,40,37,0.04);
}
blockquote p{margin:0 0 8px;}
blockquote .src{font-size:0.85em;color:#7a7069;margin:0;}
.q-lead{font-family:'Source Serif 4','Noto Sans KR',serif;font-weight:600;font-size:1.02em;}

/* ── answer box ── */
.answer{
  background:var(--card);border:1px solid rgba(107,158,122,0.28);
  border-radius:16px;box-shadow:0 4px 18px rgba(44,40,37,0.05);
  padding:clamp(18px,3vw,26px);margin:26px 0;
}
.answer .tag{
  display:inline-block;font-size:0.8em;font-weight:700;
  color:var(--green-deep);background:rgba(107,158,122,0.13);
  padding:3px 12px;border-radius:999px;margin-bottom:10px;
}
.answer p{margin:0;}

/* ── toc ── */
.toc{margin:30px 0;}
.toc-title{font-weight:700;color:var(--accent-deep);margin-bottom:12px;font-size:1.02em;}
.toc ol{margin:0;padding-left:1.6em;}
.toc li{margin:7px 0;font-size:0.95em;}
.toc li::marker{color:var(--accent);font-weight:700;}

/* ── sections ── */
section{margin:clamp(44px,7vw,68px) 0;}
.sec-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;}
.sec-num{
  flex:0 0 auto;width:2.2em;height:2.2em;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:clamp(15px,1.1rem,18px);margin-top:4px;
}
.tone-a .sec-num{background:rgba(194,112,62,0.13);color:var(--accent-deep);}
.tone-b .sec-num{background:rgba(91,124,153,0.14);color:var(--blue-deep);}
.tone-c .sec-num{background:rgba(107,158,122,0.14);color:var(--green-deep);}
h2{
  font-size:clamp(1.28rem,2.6vw + 0.5rem,1.72rem);
  font-weight:700;line-height:1.45;margin:0;
}
.tone-a h2{color:#8a4a1c;}
.tone-b h2{color:#3e5d7d;}
.tone-c h2{color:#41694f;}
.kicker{
  font-size:clamp(12px,0.85rem,13.5px);font-weight:700;letter-spacing:0.06em;
  margin:0 0 4px;
}
.tone-a .kicker{color:var(--accent-deep);}
.tone-b .kicker{color:var(--blue-deep);}
.tone-c .kicker{color:var(--green-deep);}
h3{
  font-size:clamp(1.05rem,1.6vw + 0.4rem,1.25rem);
  margin:2.2em 0 0.4em;color:#3d362f;
}
h3 .hbar{display:inline-block;width:6px;height:0.95em;border-radius:3px;margin-right:9px;vertical-align:-0.12em;}
.tone-a h3 .hbar{background:var(--accent);}
.tone-b h3 .hbar{background:var(--blue);}
.tone-c h3 .hbar{background:var(--green);}
p{margin:0.9em 0;}
strong{font-weight:700;}
.hl-a{color:var(--accent-deep);font-weight:700;}
.hl-b{color:var(--blue-deep);font-weight:700;}
.hl-c{color:var(--green-deep);font-weight:700;}

/* ── wiki entity tags ── */
.ent{
  display:inline-block;font-size:0.76em;line-height:1.5;
  padding:1.5px 9px;margin:0 1px;vertical-align:0.1em;
  border-radius:999px;white-space:nowrap;
  font-family:ui-monospace,'SF Mono',Consolas,monospace;
  background:rgba(194,112,62,0.08);
  border:1px solid rgba(194,112,62,0.2);
  color:var(--accent-deep);
}
.tone-b .ent{background:rgba(91,124,153,0.09);border-color:rgba(91,124,153,0.24);color:var(--blue-deep);}
.tone-c .ent{background:rgba(107,158,122,0.1);border-color:rgba(107,158,122,0.26);color:var(--green-deep);}

/* ── analogy box ── */
.analogy{
  margin:1.8em 0;padding:clamp(16px,2.6vw,24px);
  background:var(--card);border:1px solid var(--card-border);
  border-radius:16px;box-shadow:0 4px 18px rgba(44,40,37,0.05);
}
.analogy-head{font-weight:700;margin-bottom:8px;font-size:0.98em;}
.tone-a .analogy-head{color:var(--accent-deep);}
.tone-b .analogy-head{color:var(--blue-deep);}
.tone-c .analogy-head{color:var(--green-deep);}
.analogy p{margin:0.5em 0 0;}

/* ── keypoint ── */
.keypoint{
  margin:2em 0;padding:14px 20px;border-radius:12px;
  font-weight:500;font-size:0.97em;
}
.tone-a .keypoint{background:rgba(194,112,62,0.08);border-left:4px solid var(--accent);}
.tone-b .keypoint{background:rgba(91,124,153,0.08);border-left:4px solid var(--blue);}
.tone-c .keypoint{background:rgba(107,158,122,0.09);border-left:4px solid var(--green);}

/* ── entity cloud ── */
.ent-cloud{
  margin-top:1.8em;padding:13px 18px;border-radius:12px;
  background:rgba(44,40,37,0.03);border:1px dashed rgba(44,40,37,0.14);
  font-size:0.88em;color:#6e655e;
}
.ent-cloud .lbl{font-weight:700;margin-right:6px;}

/* ── table ── */
.table-wrap{overflow-x:auto;margin:1.8em 0;border-radius:14px;border:1px solid var(--card-border);box-shadow:0 4px 18px rgba(44,40,37,0.05);}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--card);}
th
</body>
</html>
