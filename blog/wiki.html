<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카메라는 주방만 본다 — MCP 에이전트 하이재킹과 실행 시점 제어의 구조적 균열</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7;
  --ink:#2c2825;
  --ink-soft:#5a524b;
  --o:#c2703e;
  --b:#5b7c99;
  --g:#6b9e7a;
  --card:rgba(255,255,255,0.7);
  --cborder:rgba(194,112,62,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  font-weight:400;
  line-height:2.0;
  font-size:clamp(15.5px,2.4vw,17.5px);
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:840px;margin:0 auto;padding:0 20px 60px;}
::selection{background:rgba(194,112,62,0.18);}

/* ---------- 헤더 ---------- */
header{padding:clamp(28px,6vw,56px) 0 8px;text-align:left;}
.kicker{
  display:inline-block;
  font-size:0.78em;
  font-weight:700;
  letter-spacing:0.14em;
  color:var(--o);
  border:1px solid rgba(194,112,62,0.3);
  border-radius:999px;
  padding:4px 14px;
  margin-bottom:18px;
  background:rgba(194,112,62,0.05);
}
h1{
  font-family:'Source Serif 4',serif;
  font-weight:700;
  font-size:clamp(29px,6.6vw,46px);
  line-height:1.38;
  margin-bottom:14px;
}
.subtitle{
  font-family:'Source Serif 4',serif;
  font-weight:600;
  font-size:clamp(16px,3.2vw,20px);
  color:var(--ink-soft);
  line-height:1.7;
  margin-bottom:20px;
}
.meta{
  font-size:0.82em;
  color:#7a7069;
  padding-bottom:6px;
}
.accent-bar{
  height:4px;
  border-radius:4px;
  margin:22px 0 6px;
  background:linear-gradient(90deg,var(--o),var(--b),var(--g));
  opacity:0.55;
}

/* ---------- 리드 ---------- */
.lead{
  font-size:clamp(16px,3vw,18.5px);
  font-weight:500;
  line-height:2.05;
  color:#3d3730;
  margin:26px 0;
}
.lead b{color:var(--o);font-weight:700;}

/* ---------- 본문 ---------- */
section{margin-top:clamp(52px,9vw,84px);scroll-margin-top:16px;}
.sec-num{
  font-family:'Source Serif 4',serif;
  font-weight:700;
  font-size:clamp(38px,7.5vw,54px);
  line-height:1;
  color:rgba(194,112,62,0.28);
}
h2{
  font-family:'Source Serif 4',serif;
  font-weight:700;
  font-size:clamp(21px,4.4vw,28px);
  line-height:1.5;
  margin:6px 0 8px;
}
.sec-rule{
  height:1px;
  background:linear-gradient(90deg,rgba(194,112,62,0.35),rgba(194,112,62,0));
  margin:14px 0 24px;
}
h3{
  font-family:'Source Serif 4',serif;
  font-weight:600;
  font-size:clamp(17px,3.4vw,20px);
  margin:34px 0 10px;
}
h3.tint-b{color:var(--b);}
h3.tint-o{color:var(--o);}
h3.tint-g{color:var(--g);}
p{margin:14px 0;}
p strong{font-weight:700;}
.em-o{color:var(--o);font-weight:700;}
.em-b{color:var(--b);font-weight:700;}
.em-g{color:var(--g);font-weight:700;}

/* ---------- 카드 ---------- */
.card{
  background:var(--card);
  border:1px solid var(--cborder);
  border-radius:16px;
  box-shadow:0 4px 20px rgba(44,40,37,0.06);
  padding:clamp(20px,4vw,30px);
  margin:28px 0;
}
.card-title{
  font-family:'Source Serif 4',serif;
  font-weight:700;
  font-size:1.05em;
  margin-bottom:12px;
  color:var(--o);
}
.card ul,.card ol{padding-left:1.2em;}
.card li{margin:10px 0;}
.card li::marker{color:var(--o);}

/* ---------- 인용구 ---------- */
blockquote{
  display:block;
  border-left:4px solid var(--o);
  max-width:800px;
  margin:34px auto;
  padding:12px 18px 12px 24px;
  background:rgba(194,112,62,0.05);
  border-radius:0 14px 14px 0;
  font-family:'Source Serif 4',serif;
  font-weight:600;
  font-size:clamp(17px,3.4vw,20.5px);
  line-height:1.85;
  color:#4a423a;
}

/* ---------- 위키 엔티티 칩 ---------- */
.wiki{
  display:inline-block;
  font-size:0.8em;
  font-weight:500;
  line-height:1.5;
  color:var(--b);
  background:rgba(91,124,153,0.08);
  border:1px solid rgba(91,124,153,0.2);
  border-radius:7px;

</body>
</html>
