<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개선을 개선하는 일은, 개선하는 일과 다르다 — Wiki 자기진화 두 층위 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7;
  --ink:#2c2825;
  --terra:#c2703e;
  --blue:#5b7c99;
  --green:#6b9e7a;
  --card:rgba(255,255,255,0.7);
  --card-border:rgba(194,112,62,0.12);
  --soft:rgba(44,40,37,0.62);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  font-weight:400;
  font-size:clamp(15px,0.5vw + 13px,17.5px);
  line-height:1.95;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(16px,4vw,32px);}
p{margin:1.15em 0;}
strong{font-weight:700;}
.em-t{color:var(--terra);font-weight:700;}
.em-b{color:var(--blue);font-weight:700;}
.em-g{color:var(--green);font-weight:700;}

/* ---------- 히어로 ---------- */
.hero{text-align:center;padding:clamp(36px,7vw,72px) 0 clamp(24px,4vw,44px);}
.hero .kicker{
  display:inline-block;color:var(--terra);font-weight:700;
  font-size:clamp(11px,1.3vw,13px);letter-spacing:0.22em;
  text-transform:uppercase;margin-bottom:18px;
  border:1px solid rgba(194,112,62,0.3);border-radius:999px;padding:6px 18px;
  background:rgba(194,112,62,0.05);
}
h1{
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:clamp(27px,5.2vw,46px);line-height:1.35;letter-spacing:-0.02em;
  margin-bottom:20px;
}
h1 .hl{color:var(--terra);}
.hero .sub{
  color:var(--soft);max-width:640px;margin:0 auto;
  font-size:clamp(14px,1.6vw,16.5px);line-height:1.85;
}
.hero .meta{
  margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;
  font-size:clamp(12px,1.3vw,13px);color:var(--soft);
}
.hero .meta span{display:inline-flex;align-items:center;gap:5px;}
.hero .meta .dot{color:var(--terra);}
.divider{
  width:64px;height:3px;background:linear-gradient(90deg,var(--terra),var(--blue),var(--green));
  border-radius:99px;margin:0 auto;
}

/* ---------- 위키 배지 ---------- */
.wl{
  display:inline-block;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:0.8em;line-height:1.6;
  background:rgba(91,124,153,0.08);color:var(--blue);
  border:1px solid rgba(91,124,153,0.25);border-radius:6px;
  padding:1px 7px;margin:0 2px;word-break:break-all;
  vertical-align:baseline;white-space:normal;
}

/* ---------- 인용구 ---------- */
blockquote{
  border-left:3px solid #c2703e;
  max-width:800px;margin:36px auto;padding:6px 26px;
  font-family:'Source Serif 4',serif;
  font-size:clamp(16px,2vw,19px);line-height:1.85;
  font-style:italic;
}
blockquote .cite{
  display:block;margin-top:14px;font-family:'Noto Sans KR',sans-serif;
  font-style:normal;font-size:clamp(12px,1.3vw,13.5px);
  color:var(--soft);letter-spacing:0.02em;
}
blockquote .cite::before{content:"— ";color:var(--terra);}

/* ---------- 카드 공통 ---------- */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:16px;
  box-shadow:0 4px 20px rgba(194,112,62,0.07),0 1px 3px rgba(44,40,37,0.04);
  padding:clamp(20px,3.5vw,30px);
  margin:32px 0;
}
.card-tag{
  display:inline-block;font-size:clamp(11px,1.3vw,12.5px);font-weight:700;
  letter-spacing:0.14em;color:var(--terra);
  border-bottom:2px solid rgba(194,112,62,0.35);
  padding-bottom:4px;margin-bottom:14px;
}

/* ---------- 노트 박스 ---------- */
.note{
  background:rgba(91,124,153,0.06);border:1px dashed rgba(91,124,153,0.35);
  border-radius:12px;padding:16px 20px;margin:24px 0;
  font-size:clamp(13px,1.4vw,14.5px);color:var(--soft);line-height:1.85;
}
.note b{color:var(--blue);}

/* ---------- 이중 루프 도식 ---------- */
.loop-outer{
  border:2px dashed rgba(194,112,62,0.55);border-radius:18px;
  padding:clamp(18px,3vw,26px);margin:36px 0;background:rgba(194,112,62,0.03);
}
.loop-label{
  font-size:clamp(12px,1.4vw,13.5px);font-weight:700;letter-spacing:0.06em;
  margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.loop-outer .loop-label{color:var(--terra);}
.loop-inner{
  border:2px solid rgba(91,124,153,0.5);border-radius:14px;
  padding:clamp(14px,2.5vw,20px);background:rgba(91,124,153,0.04);
}
.loop-inner .loop-label{color:var(--blue);margin-bottom:10px;}
.loop-flow{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-weight:700;font-size:clamp(13px,1.7vw,15.5px);
}
.loop-flow .n{
  background:rgba(255,255,255,0.85);border:1px solid rgba(91,124,153,0.3);
  border-radius:10px;padding:6px 14px;color:var(--blue);
  box-shadow:0 1px 4px rgba(91,124,153,0.12);
}
.loop-flow .a{color:var(--blue);font-weight:900;}
.loop-caption{
  margin-top:14px;font-size:clamp(12.5px,1.4vw,13.5px);color:var(--soft);line-height:1.8;
}

/* ---------- 1차 vs 2차 비교 ---------- */
.vs-wrap{display:flex;flex-wrap:wrap;gap:16px;margin:36px 0;}
.vs-card{
  flex:1 1 280px;min-width:0;
  background:var(--card);border-radius:16px;padding:clamp(20px,3vw,26px);
  box-shadow:0 4px 20px rgba(194,112,62,0.07);
}
.vs-1{border-top:4px solid var(--blue);}
.vs-2{border-top:4px solid var(--terra);}
.vs-badge{
  display:inline-block;font-size:clamp(11.5px,1.3vw,12.5px);font-weight:900;
  letter-spacing:0.12em;border-radius:999px;padding:4px 14px;margin-bottom:12px;
}
.vs-1 .vs-badge{color:var(--blue);background:rgba(91,124,153,0.1);border:1px solid rgba(91,124,153,0.3);}
.vs-2 .vs-badge{color:var(--terra);background:rgba(194,112,62,0.09);border:1px solid rgba(194,112,62,0.3);}
.vs-card h4{
  font-family:'Source Serif 4',serif;font-size:clamp(17px,2.2vw,20px);
  margin-bottom:12px;line-height:1.5;
}
.vs-card ul{list-style:none;}
.vs-card li{
  font-size:clamp(13.5px,1.5vw,14.5px);line-height:1.8;
  padding:9px 0;border-bottom:1px solid rgba(44,40,37,0.06);
}
.vs-card li:last-child{border-bottom:none;}
.vs-card li b{display:block;font-size:0.86em;letter-spacing:0.05em;margin-bottom:2px;}
.vs-1 li b{color:var(--blue);}
.vs-2 li b{color:var(--terra);}

/* ---------- 섹션 헤더 ---------- */
section{padding:clamp(36px,6vw,64px) 0 0;}
.sec-head{margin-bottom:8px;}
.sec-line{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.sec-num{
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:clamp(38px,6vw,56px);color:rgba(194,112,62,0.28);line-height:1;
}
.sec-kicker{
  font-size:clamp(11.5px,1.4vw,13px);font-weight:700;color:var(--terra);
  letter-spacing:0.18em;text-transform:uppercase;
}
h2{
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:clamp(22px,3.6vw,32px);line-height:1.45;letter-spacing:-0.01em;
  margin-top:6px;
}
h3{
  font-family:'Source Serif 4',serif;font-weight:600;
  font-size:clamp(17px,2.3vw,20px);margin:2em 0 0.4em;
}
h3 .mk{color:var(--green);margin-right:6px;}

/* ---------- 세 개의 문 ---------- */
.gates{display:flex;flex-direction:column;gap:16px;margin:32px 0;}
.gate{
  background:var(--card);border:1px solid var(--card-border);border-radius:16px;
  padding:clamp(18px,3vw,26px);
  box-shadow:0 4px 20px rgba(194,112,62,0.07);
  border-left:4px solid var(--blue);
}
.gate:nth-child(2){border-left-color:var(--terra);}
.gate:nth-child(3){border-left-color:var(--green);}
.gate-num{
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:clamp(12.5px,1.4vw,13.5px);letter-spacing:0.16em;
  color:var(--soft);margin-bottom:6px;
}
.gate h4{
  font-family:'Source Serif 4',serif;font-size:clamp(17px,2.2vw,20px);
  margin-bottom:8px;
}
.gate p{font-size:clamp(13.5px,1.5vw,15px);line-height:1.85;margin:0.4em 0;}

/* ---------- 수리 제안 ---------- */
.fixes{counter-reset:fix;margin:30px 0;display:flex;flex-direction:column;gap:14px;}
.fix{
  counter-increment:fix;position:relative;
  background:rgba(107,158,122,0.05);border:1px solid rgba(107,158,122,0.25);
  border-radius:14px;padding:18px 20px 18px 64px;
}
.fix::before{
  content:counter(fix);
  position:absolute;left:18px;top:18px;
  width:32px;height:32px;border-radius:50%;
  background:var(--green);color:#faf9f7;
  display:flex;align-items:center;justify-content:center;
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:16px;
  box-shadow:0 2px 8px rgba(107,158,122,0.35);
}

</body>
</html>
