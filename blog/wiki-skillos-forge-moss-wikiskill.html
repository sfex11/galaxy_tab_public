<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보이지 않는 진화를 감사할 수 있는가 — SwarmEvolve와 아티팩트 감사 프레임의 붕괴점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7;
  --ink:#2c2825;
  --orange:#c2703e;
  --blue:#5b7c99;
  --green:#6b9e7a;
  --card:rgba(255,255,255,0.7);
  --card-border:rgba(194,112,62,0.12);
  --ink-soft:#5a534b;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  font-size:clamp(1rem,0.93rem + 0.35vw,1.08rem);
  line-height:1.85;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(16px,4vw,28px);}
h1,h2,h3,.serif{font-family:'Source Serif 4','Noto Sans KR',serif;}
h1{font-size:clamp(1.85rem,5.4vw,2.9rem);line-height:1.32;font-weight:900;margin:0 0 18px;}
h2{font-size:clamp(1.42rem,3.8vw,1.95rem);line-height:1.4;font-weight:700;margin:0 0 6px;}
h3{font-size:clamp(1.1rem,2.8vw,1.3rem);line-height:1.45;font-weight:700;margin:0 0 10px;}
p{margin:0 0 1.15em;}
a{color:var(--blue);}
/* ── 히어로 ── */
.hero{padding:clamp(2.2rem,6vw,4rem) 0 clamp(1rem,3vw,1.6rem);}
.eyebrow{
  display:inline-block;
  font-size:clamp(0.78rem,2vw,0.86rem);
  font-weight:700;
  letter-spacing:0.12em;
  color:var(--orange);
  background:rgba(194,112,62,0.09);
  border:1px solid rgba(194,112,62,0.18);
  border-radius:999px;
  padding:5px 16px;
  margin-bottom:20px;
}
.subtitle{
  font-size:clamp(1.02rem,2.6vw,1.18rem);
  color:var(--ink-soft);
  line-height:1.8;
  max-width:720px;
}
.dots{display:flex;gap:8px;margin-top:24px;}
.dots span{width:11px;height:11px;border-radius:50%;display:inline-block;}
.dots .d1{background:var(--orange);}
.dots .d2{background:var(--blue);}
.dots .d3{background:var(--green);}
.meta{
  margin-top:16px;
  font-size:clamp(0.82rem,2vw,0.9rem);
  color:var(--ink-soft);
  border-top:1px dashed rgba(44,40,37,0.15);
  padding-top:14px;
}
.meta b{color:var(--ink);}
/* ── 목차 ── */
.toc{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:14px;
  box-shadow:0 4px 18px rgba(194,112,62,0.08);
  padding:clamp(16px,3vw,24px);
  margin:clamp(1.6rem,4vw,2.4rem) 0;
}
.toc-title{font-weight:700;color:var(--orange);font-size:0.92rem;letter-spacing:0.06em;margin-bottom:10px;}
.toc ol{margin:0;padding-left:22px;}
.toc li{margin:4px 0;}
.toc a{color:var(--blue);text-decoration:none;font-weight:500;}
.toc a:hover{text-decoration:underline;}
/* ── 카드 공통 ── */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:14px;
  box-shadow:0 4px 18px rgba(194,112,62,0.08);
  padding:clamp(18px,3.2vw,28px);
}
.tldr{border-left:5px solid var(--orange);margin:clamp(1.6rem,4vw,2.4rem) 0;}
.tldr-label{
  font-size:0.82rem;font-weight:700;letter-spacing:0.14em;
  color:var(--orange);margin-bottom:8px;
}
.tldr-verdict{
  font-family:'Source Serif 4',serif;
  font-size:clamp(1.3rem,3.6vw,1.7rem);
  font-weight:900;line-height:1.45;margin-bottom:14px;
}
.tldr-verdict .no{color:var(--orange);}
.tldr-verdict .yes{color:var(--green);}
.tldr ul{margin:0;padding-left:1.2em;}
.tldr li{margin:6px 0;}
/* ── 인용구 ── */
blockquote{
  border-left:4px solid var(--orange);
  background:rgba(194,112,62,0.05);
  border-radius:0 12px 12px 0;
  max-width:800px;
  margin:clamp(1.8rem,4.5vw,2.6rem) auto;
  padding:clamp(14px,2.5vw,20px) clamp(16px,3vw,26px);
  font-family:'Source Serif 4','Noto Sans KR',serif;
  font-size:clamp(1.05rem,2.6vw,1.22rem);
  line-height:1.75;
  font-weight:600;
  color:#4a423b;
}
blockquote .src{display:block;font-family:'Noto Sans KR',sans-serif;font-size:0.8rem;font-weight:500;color:var(--ink-soft);margin-top:10px;}
/* ── 섹션 ── */
section{margin:clamp(2.6rem,6.5vw,4.2rem) 0;}
.sec-head{margin-bottom:clamp(1rem,3vw,1.5rem);}
.sec-tag{
  display:inline-block;
  font-size:0.78rem;font-weight:700;letter-spacing:0.1em;
  padding:3px 12px;border-radius:999px;margin-bottom:12px;
}

</body>
