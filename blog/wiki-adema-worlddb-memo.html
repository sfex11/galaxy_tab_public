<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background:#faf9f7;
  color:#2c2825;
  font-family:'Noto Sans KR', sans-serif;
  font-size:clamp(15px, 1.05vw + 9px, 17px);
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
.container { max-width:860px; margin:0 auto; padding:clamp(16px,4vw,32px); }

nav a:hover { background:rgba(194,112,62,0.08); }

.hero { padding:clamp(20px,4vw,36px) 0 8px; }
.kicker {
  color:#c2703e; font-weight:700;
  letter-spacing:0.14em; font-size:clamp(11px,1.2vw,13px);
}
h1 {
  font-family:'Source Serif 4','Noto Sans KR',serif;
  font-size:clamp(26px,4.6vw,42px);
  line-height:1.4;
  font-weight:700;
  margin:14px 0 12px;
}
.subtitle {
  color:#5b7c99;
  font-size:clamp(15px,1.7vw,18px);
  font-weight:500;
  line-height:1.7;
}
.meta {
  display:flex; flex-wrap:wrap; gap:6px 16px;
  margin-top:18px;
  color:rgba(44,40,37,0.55);
  font-size:clamp(12px,1.2vw,14px);
}
.meta span::before { content:"·"; margin-right:16px; color:rgba(194,112,62,0.5); }
.meta span:first-child::before { content:none; }

.summary-card {
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(194,112,62,0.12);
  border-radius:16px;
  box-shadow:0 6px 24px rgba(44,40,37,0.06);
  padding:clamp(18px,3vw,28px);
  margin-top:clamp(24px,4vw,36px);
}
.summary-title {
  font-family:'Source Serif 4','Noto Sans KR',serif;
  font-weight:700; font-size:clamp(16px,1.8vw,19px);
  color:#c2703e; margin-bottom:14px;
}
.summary-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
}
.summary-item {
  background:rgba(255,255,255,0.65);
  border:1px solid rgba(194,112,62,0.12);
  border-radius:12px;
  padding:14px 16px;
}
.summary-item strong {
  display:block; font-size:clamp(14px,1.4vw,15px);
  margin-bottom:4px;
}
.summary-item.c1 strong { color:#c2703e; }
.summary-item.c2 strong { color:#5b7c99; }
.summary-item.c3 strong { color:#6b9e7a; }
.summary-item p { font-size:clamp(13px,1.3vw,14px); line-height:1.7; margin:0; color:rgba(44,40,37,0.8); }

section { margin-top:clamp(48px,7vw,76px); }
.sec-head { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; }
.sec-num {
  font-family:'Source Serif 4',serif;
  font-size:clamp(30px,4vw,42px);
  color:rgba(194,112,62,0.35);
  font-weight:700; line-height:1;
}
h2 {
  font-family:'Source Serif 4','Noto Sans KR',serif;
  font-size:clamp(21px,2.9vw,28px);
  line-height:1.45;
  font-weight:700;
}
p { margin-bottom:1.15em; }
strong.hl-o { color:#c2703e; }
strong.hl-b { color:#5b7c99; }
strong.hl-g { color:#6b9e7a; }

.wiki {
  color:#5b7c99;
  text-decoration:none;
  border-bottom:1px dashed rgba(91,124,153,0.55);
  font-weight:500;
  white-space:nowrap;
}
.wiki:hover { border-bottom-style:solid; }

.analogy-box {
  background:rgba(194,112,62,0.06);
  border:1px solid rgba(194,112,62,0.18);
  border-radius:14px;
  padding:clamp(16px,2.5vw,24px);
  margin:clamp(22px,3.5vw,30px) 0;
}
.analogy-label {
  display:inline-block;
  color:#c2703e; font-weight:700;
  font-size:clamp(11px,1.15vw,12.5px);
  letter-spacing:0.1em;
  border:1px solid rgba(194,112,62,0.35);
  border-radius:999px;
  padding:2px 12px;
  margin-bottom:10px;
}
.analogy-box p:last-child { margin-bottom:0; }

blockquote {
  border-left:4px solid #c2703e;
  max-width:800px;
  margin:2.2rem auto;
  padding:16px 24px;
  background:rgba(255,255,255,0.6);
  border-radius:0 12px 12px 0;
  font-family:'Source Serif 4','Noto Sans KR',serif;
  font-size:clamp(17px,2.1vw,20px);
  line-height:1.75;
}

.chart-card {
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(194,112,62,0.12);
  border-radius:14px;
  box-shadow:0 4px 18px rgba(44,40,37,0.05);
  padding:clamp(16px,2.5vw,24px);
  margin:clamp(22px,3.5vw,30px) 0;
}
.chart-title {
  font-weight:700; font-size:clamp(13px,1.35vw,14.5px);
  color:#5b7c99; margin-bottom:14px;
}
.chart-row {
  display:grid;
  grid-template-columns:minmax(110px,170px) 1fr auto;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.chart-row:last-child { margin-bottom:0; }
.chart-label { font-size:clamp(12px,1.25vw,13.5px); color:rgba(44,40,37,0.75); }
.chart-bar {
  height:clamp(18px,2.6vw,24px);
  border-radius:6px;
  transform-origin:left;
  animation:barGrow 0.9s ease both;
}
@keyframes barGrow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.bar-a { background:#6b9e7a; }
.bar-b { background:#5b7c99; }
.bar-c { background:#c2703e; }
.chart-val {
  font-family:'Source Serif 4',serif;
  font-weight:700; font-size:clamp(13px,1.4vw,15px);
  min-width:4.5em; text-align:right;
}
.v-a { color:#6b9e7a; } .v-b { color:#5b7c99; } .v-c { color:#c2703e; }
.chart-note { font-size:clamp(12px,1.2vw,13px); color:rgba(44,40,37,0.55); margin-top:12px; }

.cross-move {
  display:flex; gap:12px; align-items:stretch;
  margin:clamp(22px,3.5vw,30px) 0;
}
.move-box {
  flex:1;
  border-radius:14px;
  padding:clamp(14px,2vw,20px);
}
.move-up {
  border:1px solid rgba(107,158,122,0.45);
  background:rgba(107,158,122,0.09);
}
.move-down {
  border:1px solid rgba(91,124,153,0.45);
  background:rgba(91,124,153,0.09);
}
.move-tag {
  font-weight:700;
  font-size:clamp(13px,1.4vw,15px);
  margin-bottom:10px;
}
.move-up .move-tag { color:#6b9e7a; }
.move-down .move-tag { color:#5b7c99; }
.move-box ul { list-style:none; }
.move-box li {
  font-size:clamp(13px,1.3vw,14px);
  line-height:1.7;
  padding-left:1.2em;
  position:relative;
  margin-bottom:4px;
}
.move-up li::before { content:"↑"; position:absolute; left:0; color:#6b9e7a; font-weight:700; }
.move-down li::before { content:"↓"; position:absolute; left:0; color:#5b7c99; font-weight:700; }
.move-mid {
  display:flex; align-items:center; justify-content:center;
  font-family:'Source Serif 4',serif;
  color:#c2703e; font-weight:700;
  font-size:clamp(16px,2vw,20px);
  writing-mode:vertical-rl;
  letter-spacing:0.2em;
}
.chain-card {
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(194,112,62,0.12);
  border-radius:14px;
  box-shadow:0 4px 18px rgba(44,40,37,0.05);
  padding:clamp(16px,2.5vw,24px);
  margin:clamp(22px,3.5vw,30px) 0;
}
.chain-title { font-weight:700; color:#c2703e; font-size:clamp(13px,1.35vw,14.5px); margin-bottom:12px; }
.chain-flow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.chain-node {
  background:rgba(91,124,153,0.1);
  border:1px solid rgba(91,124,153,0.3);
  border-radius:10px;
  padding:8px 14px;
  font-size:clamp(13px,1.3vw,14px);
  font-weight:500;
  color:#2c2825;
}
.chain-node em { font-style:normal; font-size:0.85em; color:#5b7c99; display:block; }
.chain-arrow { color:#c2703e; font-weight:700; }

.conclusion {
  margin-top:clamp(48px,7vw,76px);
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(194,112,62,0.12);
  border-radius:18px;
  box-shadow:0 8px 28px rgba(44,40,37,0.07);
  padding:clamp(20px,3.5vw,32px);
}
.conclusion-head {
  font-family:'Source Serif 4','Noto Sans KR',serif;
  font-size:clamp(20px,2.7vw,26px);
  font-weight:700;
  color:#c2703e;
  margin-bottom:16px;
}
.turn-list { list-style:none; counter-reset:turn; }
.turn-list li {
  counter-increment:turn;
  position:relative;
  padding:14px 0 14px 52px;
  border-top:1px dashed rgba(194,112,62,0.25);
}
