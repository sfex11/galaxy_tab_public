<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커튼의 각도는 누가 정하는가 — 신뢰 인지적 적응 공개와 프라이버시의 동적 자원화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --ink:#2c2825;
    --ink-soft:#5a524a;
    --terra:#c2703e;
    --blue:#5b7c99;
    --green:#6b9e7a;
    --card:rgba(255,255,255,0.7);
    --card-border:rgba(194,112,62,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-weight:400;
    line-height:2.0;
    font-size:clamp(15px, 1.05rem + 0.3vw, 17px);
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  .container{
    max-width:800px;
    margin:0 auto;
    padding:0 20px 90px;
  }
  h1,h2,h3{
    font-family:'Source Serif 4','Noto Sans KR',serif;
    line-height:1.45;
    font-weight:700;
  }
  h1{font-size:clamp(28px, 1.6rem + 3vw, 44px); margin:14px 0 10px;}
  h2{font-size:clamp(22px, 1.2rem + 1.8vw, 30px); margin:0 0 20px;}
  h3{font-size:clamp(18px, 1rem + 1vw, 21px); margin:34px 0 12px;}
  p{margin:0 0 22px;}
  strong{font-weight:700;}
  em{font-style:italic;}
  a{color:var(--blue);}

  /* ---------- hero ---------- */
  header.hero{padding:52px 0 10px;}
  .eyebrow{
    display:inline-block;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.18em;
    color:var(--terra);
    text-transform:uppercase;
    border:1px solid rgba(194,112,62,0.35);
    border-radius:999px;
    padding:4px 14px;
    background:rgba(194,112,62,0.06);
  }
  .hero h1 em{font-style:normal; color:var(--terra);}
  .subtitle{
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(16px, 1rem + 0.8vw, 20px);
    color:var(--ink-soft);
    margin:6px 0 22px;
  }
  .meta-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .meta-row .dot{color:rgba(194,112,62,0.6);}
  .tag{
    background:rgba(91,124,153,0.10);
    color:var(--blue);
    border-radius:6px;
    padding:2px 9px;
    font-size:0.8rem;
    font-weight:500;
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    box-shadow:0 8px 28px rgba(44,40,37,0.07);
    padding:clamp(20px, 2rem + 1vw, 32px);
    margin:34px 0;
  }
  .card h3{margin-top:0;}

  /* ---------- toc ---------- */
  .toc ol{
    list-style:none;
    counter-reset:toc;
    margin:0;
    padding:0;
  }
  .toc li{
    counter-increment:toc;
    padding:11px 4px;
    border-bottom:1px dashed rgba(194,112,62,0.18);
    font-size:0.95rem;
  }
  .toc li:last-child{border-bottom:none;}
  .toc a{text-decoration:none; color:var(--ink); font-weight:500;}
  .toc a:hover{color:var(--terra);}
  .toc .num{
    font-family:'Source Serif 4',serif;
    color:var(--terra);
    font-weight:700;
    margin-right:10px;
  }

  /* ---------- section header ---------- */
  section{margin-top:64px;}
  .sec-label{
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.22em;
    color:var(--terra);
    margin-bottom:6px;
  }
  .sec-label::before{
    content:"§ ";
    color:rgba(194,112,62,0.5);
  }
  h2::after{
    content:"";
    display:block;
    width:52px;
    height:3px;
    border-radius:2px;
    margin-top:14px;
    background:linear-gradient(90deg, var(--terra), rgba(194,112,62,0.15));
  }

  /* ---------- text emphasis ---------- */
  .hl-terra{color:var(--terra); font-weight:700;}
  .hl-blue{color:var(--blue); font-weight:700;}
  .hl-green{color:var(--green); font-weight:700;}
  .slug{
    font-family:ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size:0.83em;
    background:rgba(91,124,153,0.09);
    color:var(--blue);
    border-radius:6px;
    padding:1px 7px;
    white-space:nowrap;
  }
  .paper-title{font-style:italic;}

  /* ---------- blockquote ---------- */
  blockquote{
    border-left:4px solid var(--terra);
    max-width:800px;
    margin:36px auto;
    padding:18px 26px;
    background:rgba(194,112,62,0.05);
    border-radius:0 14px 14px 0;
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(16px, 1rem + 0.6vw, 19px);
    color:var(--ink-soft);
  }
  blockquote p{margin:0;}

  /* ---------- callout ---------- */
  .callout{
    border-radius:0 14px 14px 0;
    padding:16px 22px;
    margin:28px 0;
    background:var(--card);
    border:1px solid var(--card-border);
    box-shadow:0 4px 16px rgba(44,40,37,0.05);
    font-size:0.95em;
  }
  .callout .co-title{
    font-weight:700;
    margin-bottom:4px;
    display:block;
  }
  .co-terra{border-left:4px solid var(--terra);}
  .co-terra .co-title{color:var(--terra);}
  .co-blue{border-left:4px solid var(--blue);}
  .co-blue .co-title{color:var(--blue);}
  .co-green{border-left:4px solid var(--green);}
  .co-green .co-title{color:var(--green);}

  /* ---------- summary card list ---------- */
  .summary-list{margin:0; padding:0; list-style:none;}
  .summary-list li{
    position:relative;
    padding:12px 0 12px 34px;
    border-bottom:1px dashed rgba(194,112,62,0.15);
  }
  .summary-list li:last-child{border-bottom:none;}
  .summary-list li::before{
    content:"✓";
    position:absolute;
    left:2px;
    top:12px;
    font-weight:700;
  }
  .summary-list li:nth-child(1)::before{color:var(--terra);}
  .summary-list li:nth-child(2)::before{color:var(--blue);}
  .summary-list li:nth-child(3)::before{color:var(--green);}

  /* ---------- problem cards (section 5) ---------- */
  .problem-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    box-shadow:0 6px 22px rgba(44,40,37,0.06);
    padding:22px 24px;
    margin:22px 0;
  }
  .problem-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:8px;
  }
  .problem-num{
    font-family:'Source Serif 4',serif;
    font-size:1.7rem;
    font-weight:700;
    color:var(--terra);
    line-height:1;
  }
  .problem-head h3{margin:0; font-size:clamp(17px, 0.95rem + 0.8vw, 20px);}
  .problem-card p{margin-bottom:0; font-size:0.95em;}

  /* ---------- paradigm shift ---------- */
  .shift-item{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:16px 18px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    margin:16px 0;
    box-shadow:0 5px 18px rgba(44,40,37,0.05);
  }
  .shift-from{
    color:var(--ink-soft);
    font-size:0.92em;
  }
  .shift-from::before{
    content:"— 기존 — ";
    color:rgba(90,82,74,0.55);
    font-weight:700;
    font-size:0.85em;
  }
  .shift-to{
    font-weight:700;
    color:var(--green);
    font-size:1.02em;
  }
  .shift-to::before{
    content:"→ 전환 — ";
    color:var(--green);
    font-weight:700;
    font-size:0.85em;
  }
  .shift-label{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    color:var(--terra);
    font-size:0.95em;
    margin-bottom:2px;
  }

  /* ---------- final line ---------- */
  .final-line{
    text-align:center;
    font-family:'Source Serif 4','Noto Sans KR',serif;
    font-size:clamp(17px, 1.05rem + 0.6vw, 21px);
    color:var(--terra);
    font-weight:600;
    margin:56px auto 0;
    max-width:640px;
    line-height:1.9;
  }
  .final-line::before, .final-line::after{
    content:"❋";
    display:block;
    color:rgba(194,112,62,0.4);
    font-size:0.8em;
    margin:14px 0;
  }

  /* ---------- footnote ---------- */
  .footnote{
    margin-top:60px;
    padding:18px 22px;
    background:rgba(91,124,153,0.06);
    border:1px solid rgba(91,124,153,0.15);
    border-radius:14px;
    font-size:0.85em;
    color:var(--ink-soft);
  }
  .footnote strong{color:var(--blue);}
  footer{
    margin-top:48px;
    text-align:center;
    font-size:0.82rem;
    color:var(--ink-soft);
  }

</body>
</html>
